# Absolute paths only. Keep the real file outside this public repository.
SKILLPORT_REPO=/absolute/path/to/SkillPort
SKILL_REPOS_FILE=/absolute/path/to/private-context/skillport/skill-repos.yaml
GUIDANCE_REPO=/absolute/path/to/private-context
GUIDANCE_SOURCE=/absolute/path/to/private-context/agent-guidance/AGENTS.md
STATE_DIR=/absolute/path/to/home/Library/Application Support/SkillPort
NPX_BIN=/absolute/path/to/npx
PYTHON_BIN=/absolute/path/to/python3
GH_BIN=/absolute/path/to/gh

# Optional, repeatable post-sync checks. Use the installed skill directory name.
# REQUIRED_GLOBAL_SKILL=expected-skill-name

# Repeated opt-ins are allowed. Visibility is still verified remotely each run.
# Private repositories may contain personal data, but never credentials.
PUSH_PRIVATE_REPO=/absolute/path/to/private-repository

# Public pushes require the exact reviewed HEAD SHA. Use REVIEW_REQUIRED until
# a human has reviewed that exact commit range and approved it for publication.
PUSH_PUBLIC_REPO=/absolute/path/to/public-repository|REVIEW_REQUIRED
