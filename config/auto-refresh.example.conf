# Canonical checkout and tool paths are explicit LaunchAgent environment
# variables. Checkout and skill scope comes from the private repository
# registry. See docs/cross-device-maintenance.md. This permission-restricted,
# machine-local file contains only optional push and verification policy.

# Repeatable post-sync checks use an installed skill directory name.
# SKILLPORT_REQUIRED_GLOBAL_SKILL=expected-skill-name

# Repeated opt-ins are allowed. Set each value to the corresponding
# machine-specific absolute repository path in the private installed file.
# SKILLPORT_PUSH_PRIVATE_REPO=<private-repository-path>

# Public pushes require the exact reviewed HEAD SHA. REVIEW_REQUIRED is the
# fail-closed default until a human approves the current commit range.
# SKILLPORT_PUSH_PUBLIC_REPO=<public-repository-path>|REVIEW_REQUIRED
